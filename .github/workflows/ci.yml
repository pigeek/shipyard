name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shipyard
          POSTGRES_PASSWORD: shipyard
          POSTGRES_DB: shipyard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipyard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      ENVIRONMENT: testing
      SECRET_KEY: ci-secret-key-that-is-long-enough-32bytes
      REDIS_URL: redis://localhost:6379/0
      # NB: DATABASE_URL is intentionally NOT set job-wide. The test suite uses an
      # in-memory SQLite (conftest sets it via setdefault); only the migration
      # check below points at the Postgres service, to keep tests fast + isolated.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python & venv
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build SPA bundle
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend run build

      - name: Lint (ruff)
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic

      - name: Type check (mypy)
        run: mypy app

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://shipyard:shipyard@localhost:5432/shipyard_test
        run: alembic upgrade head

      - name: Tests
        run: pytest -q
