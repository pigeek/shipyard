{% extends "base.html" %}
{% block title %}Log in — {{ app_name }}{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form action="/auth/login" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next|default('/') }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button class="primary" type="submit">Log in</button>
  </form>
  {% if oauth_google_enabled %}
    <p class="divider">or</p>
    <button type="button" class="oauth" onclick="oauthGoogle()">Continue with Google</button>
    <script>
      async function oauthGoogle() {
        // Canonical fastapi-users flow: the authorize endpoint sets the OAuth
        // state cookie and returns the provider URL; we then redirect to it.
        const r = await fetch('/api/v1/auth/google/authorize', { credentials: 'include' });
        const data = await r.json();
        window.location.href = data.authorization_url;
      }
    </script>
  {% endif %}
  <p>No account? <a href="/auth/register">Sign up</a>.</p>
{% endblock %}
