x-app-env: &app-env
  ENVIRONMENT: development
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  DATABASE_URL: postgresql+asyncpg://shipyard:shipyard@postgres:5432/shipyard
  REDIS_URL: redis://redis:6379/0
  BASE_URL: http://localhost:8000
  EMAIL_BACKEND: console
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # Object storage (MinIO in compose). The API reaches MinIO in-network as
  # minio:9000; presigned URLs handed to the browser must use a host the browser
  # can reach (localhost:9000), hence the separate public endpoint.
  STORAGE_PROVIDER: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-shipyard}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard
      POSTGRES_DB: shipyard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API (also the browser-facing presigned-URL host)
      - "9001:9001"   # MinIO console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket on first boot, then exit.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    environment:
      S3_BUCKET: ${S3_BUCKET:-shipyard}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      exit 0
      "

  api:
    build: .
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: .
    environment:
      <<: *app-env
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
